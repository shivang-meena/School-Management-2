services:
  postgres:
    image: postgres:16-alpine
    container_name: school-erp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_erp
    ports:
      - "5432:5432"
    # Keep the legacy prototype volume untouched. This volume is for the normalized Arihant ERP schema.
    volumes:
      - pgdata_arihant:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_arihant:
